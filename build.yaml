# GitHub Actions build matrix. Each entry produces one .uf2 artifact.
# Hardware: nice!nano v2 on both halves, 6-column Corne, no displays/encoders.
---
include:
  # Left half = central: the half that pairs with the computer. ZMK Studio over USB enabled.
  - board: nice_nano_v2
    shield: corne_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  - board: nice_nano_v2
    shield: corne_right
  # Flash to BOTH halves to wipe Bluetooth bonds and split pairing, then flash the real firmware.
  - board: nice_nano_v2
    shield: settings_reset
